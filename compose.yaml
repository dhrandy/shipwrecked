services:
  shipwrecked:
    image: ghcr.io/dhrandy/shipwrecked:0.5.0
    # or build straight from the repo instead of pulling the image:
    # build: https://github.com/dhrandy/shipwrecked.git#main
    container_name: shipwrecked
    restart: unless-stopped
    ports:
      - "8647:8647"   # non-common port; change the left side to whatever you like
    environment:
      # Put these in a .env file next to this file (the readme has a filled-out
      # example), or set them in your Docker manager's environment settings.
      TZ: ${TZ}                       # island time: day/night, holidays, moon follow it
      SIM_SPEED: ${SIM_SPEED}         # 1 = real time; higher = faster story (for demos)
      SHIPWRECKED_DB: ${SHIPWRECKED_DB}
    volumes:
      - shipwrecked-data:/data                # the island's whole memory lives here
volumes:
  shipwrecked-data:

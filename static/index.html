<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shipwrecked - a tiny island story</title>
<style>
  :root { --ink:#f4ead5; --dim:#c8b98f; --panel:rgba(12,20,32,.82); }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; overflow:hidden; background:#0b1c2c;
    font-family:'Courier New', ui-monospace, monospace; color:var(--ink); }
  canvas#scene, canvas#fx { position:fixed; inset:0; width:100%; height:100%; display:block; }
  canvas#fx { pointer-events:none; }
  .hud { position:fixed; z-index:5; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #title { top:10px; left:14px; }
  #title h1 { font-size:20px; letter-spacing:3px; }
  #title .sub { font-size:12px; color:var(--dim); margin-top:2px; }
  #meta { top:10px; right:14px; text-align:right; font-size:12px; color:var(--dim); line-height:1.5; }
  #ticker { left:0; right:0; bottom:0; padding:8px 14px; font-size:13px;
    background:linear-gradient(transparent, rgba(5,10,18,.85)); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #logbtn { bottom:44px; right:14px; background:var(--panel); border:1px solid #3a4a5e;
    color:var(--ink); font:inherit; font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer; }
  #drawer { left:0; right:0; bottom:0; max-height:62%; background:var(--panel);
    border-top:1px solid #3a4a5e; transform:translateY(100%); transition:transform .25s;
    display:flex; flex-direction:column; z-index:9; }
  #drawer.open { transform:translateY(0); }
  #drawer header { padding:10px 14px; display:flex; justify-content:space-between; align-items:center; }
  #drawer header b { letter-spacing:2px; font-size:13px; }
  #drawer header button { background:none; border:none; color:var(--ink); font:inherit; font-size:18px; cursor:pointer; }
  #drawer .cols { display:flex; gap:14px; overflow:auto; padding:0 14px 14px; }
  #drawer .col { flex:1; min-width:0; }
  #drawer h3 { font-size:11px; color:var(--dim); letter-spacing:1px; margin:6px 0; }
  #drawer .ev { font-size:12px; padding:5px 0; border-bottom:1px dashed #2a3a4e; line-height:1.45; }
  #drawer .ev time { color:var(--dim); font-size:11px; display:block; }
  #drawer .ev.story { color:#ffd98a; } #drawer .ev.milestone { color:#9ae6a0; }
  #drawer .ev.holiday { color:#f0a0c0; } #drawer .ev.event { color:#a0c8f0; }
  .needs { font-size:11px; color:var(--dim); }
  .needs .bar { display:inline-block; width:70px; height:7px; background:#223144;
    border-radius:4px; overflow:hidden; vertical-align:middle; margin:0 6px 0 2px; }
  .needs .bar i { display:block; height:100%; background:#e0b35c; }
  #catchup { position:fixed; inset:0; z-index:20; display:none; align-items:center;
    justify-content:center; background:rgba(4,8,14,.72); padding:16px; }
  #catchup.open { display:flex; }
  #catchup .card { background:var(--panel); border:1px solid #3a4a5e; border-radius:12px;
    max-width:560px; width:100%; max-height:78vh; overflow:auto; padding:18px; }
  #catchup h2 { font-size:15px; letter-spacing:1px; margin-bottom:10px; }
  #catchup .ev { font-size:13px; padding:6px 0; border-bottom:1px dashed #2a3a4e; line-height:1.5; }
  #catchup .ev time { color:var(--dim); font-size:11px; display:block; }
  #catchup .ev.story { color:#ffd98a; } #catchup .ev.milestone { color:#9ae6a0; }
  #catchup .ev.holiday { color:#f0a0c0; } #catchup .ev.event { color:#a0c8f0; }
  #catchup button { margin-top:12px; width:100%; padding:10px; font:inherit; font-size:13px;
    letter-spacing:2px; background:#e0b35c; border:none; border-radius:8px; color:#1a1206; cursor:pointer; }
  @media (max-width:640px){
    #title h1 { font-size:16px; } #meta { font-size:11px; }
    #drawer .cols { flex-direction:column; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="fx"></canvas>
<div class="hud" id="title"><h1>SHIPWRECKED</h1><div class="sub" id="chap">Day 1 · Landfall</div></div>
<div class="hud" id="meta"></div>
<div class="hud" id="ticker"></div>
<button class="hud" id="logbtn">STORY LOG</button>
<div class="hud" id="drawer">
  <header><b>THE STORY SO FAR</b><button id="closebtn" aria-label="close">×</button></header>
  <div class="cols">
    <div class="col"><h3>LOG</h3><div id="loglist"></div></div>
    <div class="col"><h3>WADE</h3><div id="stats"></div><h3>MILESTONES</h3><div id="miles"></div></div>
  </div>
</div>
<div id="catchup"><div class="card"><h2 id="cuhead">WHILE YOU WERE AWAY</h2><div id="culist"></div>
  <button id="cubtn">BACK TO THE ISLAND</button></div></div>

"use strict";
<script src="/static/vendor/three.min.js"></script>
<script>
"use strict";
// Shipwrecked v0.5.0 scene - Three.js rebuild targeting the painterly reference render.
const cv = document.getElementById('scene'), fx = document.getElementById('fx');
const fxctx = fx.getContext('2d');
let W=innerWidth, H=innerHeight, DPR=1, S=null;
let lastVisit = null;
try { lastVisit = localStorage.getItem('shipwrecked_last'); } catch(e){}
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true});
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene3 = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(31, W/H, 2, 9000);
function resize(){ DPR=Math.min(devicePixelRatio||1,1.75);
  W=innerWidth; H=innerHeight;
  renderer.setPixelRatio(DPR); renderer.setSize(W,H);
  fx.width=W*DPR; fx.height=H*DPR; fxctx.setTransform(DPR,0,0,DPR,0,0);
  camera.aspect=W/H; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

function rnd(seed){ let a=(seed>>>0)||1; return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const isNight=()=>S&&S.phase==='night';

// phase palettes: 4-stop sky gradient, fog, sun color, ambient, sun direction, water spec
const PAL={
  dawn:{sky:['#2e3a66','#7a5a8a','#e8935a','#f7cf8e'],fog:'#c99a8f',sun:0xffd9a8,sunI:1.5,hemi:0x8a7a9a,amb:.5,lv:[-.62,.34,.32],spec:.5},
  day:{sky:['#3f8fd2','#7ec3e8','#c9ecf5','#eafbff'],fog:'#bfe0ee',sun:0xfff3d8,sunI:1.9,hemi:0x9ec8e8,amb:.62,lv:[.45,.62,.45],spec:.9},
  dusk:{sky:['#3a3266','#8a4a6e','#e0703f','#ffc98a'],fog:'#e8a06a',sun:0xffb066,sunI:1.7,hemi:0x9a6a7a,amb:.5,lv:[.72,.18,.42],spec:.85},
  night:{sky:['#040814','#0a1430','#101f3e','#16294a'],fog:'#0e1a2e',sun:0x8ea8d8,sunI:.55,hemi:0x2a3a55,amb:.3,lv:[-.35,.45,.5],spec:.5},
};
const pal=()=>PAL[S?S.phase:'dusk']||PAL.dusk;

// ---------------- sky dome + celestial ----------------
const skyU={ topColor:{value:new THREE.Color('#e0703f')}, midColor:{value:new THREE.Color('#8a4a6e')},
  botColor:{value:new THREE.Color('#ffc98a')}, offset:{value:400}, exponent:{value:.9} };
{ const skyMat=new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:skyU,
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 topColor,midColor,botColor; uniform float offset,exponent; varying vec3 vP;
    void main(){ float h=normalize(vP+vec3(0.,offset,0.)).y;
      vec3 c=h>.18? mix(midColor,topColor,pow(clamp((h-.18)/.82,0.,1.),exponent))
                  : mix(botColor,midColor,pow(clamp(h/.18,0.,1.),.7));
      gl_FragColor=vec4(c,1.); }`});
  const sky=new THREE.Mesh(new THREE.SphereGeometry(4200,32,18),skyMat); scene3.add(sky); }
const hemi=new THREE.HemisphereLight(0xbfd8ee,0x8a7355,.7); scene3.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3d8,1.7); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
{ const c=sun.shadow.camera; c.left=-320;c.right=320;c.top=320;c.bottom=-320;c.near=50;c.far=1600;
  sun.shadow.bias=-.0006; sun.shadow.normalBias=1.2; }
scene3.add(sun); scene3.add(sun.target);
scene3.fog=new THREE.FogExp2(0xe8a06a,.00062);
// sun/moon glow sprite riding the light vector
function glowSprite(size,inner,outer){ const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'), gr=g.createRadialGradient(64,64,4,64,64,64);
  gr.addColorStop(0,inner); gr.addColorStop(.35,outer); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); const m=new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false});
  const sp=new THREE.Sprite(m); sp.scale.set(size,size,1); return sp; }
const sunSpr=glowSprite(700,'rgba(255,246,220,1)','rgba(255,190,110,.55)'); scene3.add(sunSpr);
const moonSpr=glowSprite(300,'rgba(232,236,244,1)','rgba(150,170,210,.4)'); scene3.add(moonSpr);
// stars
{ const n=2600, pos=new Float32Array(n*3), r=rnd(9);
  for(let i=0;i<n;i++){ const th=r()*Math.PI*2, ph=Math.acos(r()*.95);
    pos[i*3]=Math.sin(ph)*Math.cos(th)*3800; pos[i*3+1]=Math.cos(ph)*3800+100; pos[i*3+2]=Math.sin(ph)*Math.sin(th)*3800; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  window.__stars=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:3.2,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));
  window.__stars.renderOrder=999; window.__stars.frustumCulled=false; scene3.add(window.__stars); }

// ---------------- island terrain (smooth radial mesh, vertex-colored) ----------------
const ISL_R=195;
function islR(th){ return ISL_R*(1+.13*Math.sin(3*th+1.1)+.07*Math.sin(7*th+.4)); }
function islH(f){ return 46*Math.pow(Math.max(0,1-f*f),.75); }
function groundY(x,z){ const d=Math.hypot(x,z);
  const f=Math.min(1,d/islR(Math.atan2(z,x))); return 2+islH(f); }
function n2(x,z){ const s=Math.sin(x*12.9898+z*78.233)*43758.5453; return s-Math.floor(s); }
function vnoise(x,z){ const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  return n2(xi,zi)*(1-u)*(1-v)+n2(xi+1,zi)*u*(1-v)+n2(xi,zi+1)*(1-u)*v+n2(xi+1,zi+1)*u*v; }
let islandMesh;
function buildIsland(){ const K=30, J=110, pos=[], col=[], idx=[];
  const sandA=[.97,.87,.58], sandB=[.89,.71,.44], wet=[.74,.59,.4], grassA=[.44,.74,.26], grassB=[.26,.56,.18];
  for(let k=0;k<=K;k++){ const f=k/K;
    for(let j=0;j<=J;j++){ const th=j/J*Math.PI*2, R=islR(th)*f;
      const x=Math.cos(th)*R, z=Math.sin(th)*R;
      let y=2+islH(f);
      y+= (vnoise(x*.045,z*.045)-.5)*7*f + (vnoise(x*.16,z*.16)-.5)*2.2*f;   // soft dunes + fine ripple
      const edge=(1-f);
      y+= (vnoise(x*.3,z*.3)-.5)*.55*edge;                                    // wind ripples on the beach
      pos.push(x,y,z);
      // color: grass middle with noisy organic edge, sand ring, wet band at the waterline
      const ge=.42+.09*Math.sin(3*th+.7)+.05*Math.sin(7*th+2.1)+(vnoise(th*8,3.7)-.5)*.1;
      const g=clamp((ge-f)*9+ .5,0,1);
      const n=vnoise(x*.35,z*.35), n3=vnoise(x*.09+40,z*.09);
      let c=[ sandA[0]+(sandB[0]-sandA[0])*n3, sandA[1]+(sandB[1]-sandA[1])*n3, sandA[2]+(sandB[2]-sandA[2])*n3 ];
      if(f>.9){ const w=clamp((f-.9)/.06,0,1);
        c=[c[0]+(wet[0]-c[0])*w, c[1]+(wet[1]-c[1])*w, c[2]+(wet[2]-c[2])*w]; }
      const gc=[ grassA[0]+(grassB[0]-grassA[0])*n, grassA[1]+(grassB[1]-grassA[1])*n, grassA[2]+(grassB[2]-grassA[2])*n ];
      c=[ c[0]+(gc[0]-c[0])*g, c[1]+(gc[1]-c[1])*g, c[2]+(gc[2]-c[2])*g ];
      col.push(c[0],c[1],c[2]); } }
  for(let k=0;k<K;k++) for(let j=0;j<J;j++){ const a=k*(J+1)+j, b=a+1, c2=a+J+1, d=c2+1;
    idx.push(a,c2,b, b,c2,d); }
  // skirt: outer ring dropped below the waterline
  const base=K*(J+1);
  for(let j=0;j<=J;j++){ const th=j/J*Math.PI*2, R=islR(th)*1.03;
    pos.push(Math.cos(th)*R,-14,Math.sin(th)*R); col.push(.62,.5,.36); }
  for(let j=0;j<J;j++){ const a=base-(J+1)+j, b=a+1, c2=base+j, d=c2+1;
    idx.push(a,c2,b, b,c2,d); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  islandMesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,metalness:0,side:THREE.DoubleSide}));
  islandMesh.receiveShadow=true; scene3.add(islandMesh); }

// ---------------- ocean: real rolling waves + foam (custom shader) ----------------
const WN=150, WSPAN=7000;
function wmap(s){ const half=WSPAN/2; return Math.sign(s)*half*Math.pow(Math.abs(s),2.55); }
const waterU={ uTime:{value:0}, uTide:{value:0},
  uShal:{value:new THREE.Color('#3ec2b4')}, uDeep:{value:new THREE.Color('#0d3a5e')},
  uSky:{value:new THREE.Color('#bfe0ee')}, uSunDir:{value:new THREE.Vector3(.45,.62,.45)},
  uSunCol:{value:new THREE.Color('#fff3d8')}, uFogCol:{value:new THREE.Color('#bfe0ee')},
  uCamPos:{value:new THREE.Vector3()}, uFogDen:{value:.00062}, uSpec:{value:.9} };
let waterMesh;
function buildWater(){ const n=WN+1, pos=[], uv=[], idx=[];
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const s=i/WN*2-1, t=j/WN*2-1;
    pos.push(wmap(s),0,wmap(t)); uv.push(s,t); }
  for(let i=0;i<WN;i++) for(let j=0;j<WN;j++){ const a=i*n+j,b=a+1,c=a+n,d=c+1; idx.push(a,c,b,b,c,d); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  const m=new THREE.ShaderMaterial({ uniforms:waterU, transparent:false, side:THREE.DoubleSide,
    vertexShader:`uniform float uTime,uTide; varying vec3 vW; varying float vCrest;
      float wave(vec2 p, vec2 d, float f, float sp, float amp){ return sin(dot(p,d)*f+uTime*sp)*amp; }
      void main(){ vec3 p=position;
        float d0=length(p.xz);
        float amp = 1.4 + 2.4*smoothstep(180.,700.,d0);           // calm in the lagoon, rolling outside
        amp += 3.4*exp(-pow((d0-265.)/75.,2.));            // breaker train rearing up outside the shore
        float h = wave(p.xz,vec2(.83,.55),.021,.00115,1.) + wave(p.xz,vec2(-.42,.91),.033,.0009,.7)
                + wave(p.xz,vec2(.17,-.98),.052,.0014,.45) + wave(p.xz,vec2(-.9,-.44),.013,.0007,1.2);
        p.y = h*amp + uTide;
        vCrest = amp>0.001? clamp((h*amp)*.5/max(amp,0.001)+.5, 0., 1.) : .5;
        vW = p;
        gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.); }`,
    fragmentShader:`uniform vec3 uShal,uDeep,uSky,uSunDir,uSunCol,uFogCol,uCamPos; uniform float uTime,uFogDen,uSpec,uTide;
      varying vec3 vW; varying float vCrest;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y); }
      float islR(float th){ return 195.*(1.+.13*sin(3.*th+1.1)+.07*sin(7.*th+.4)); }
      void main(){
        float d=length(vW.xz); float th=atan(vW.z,vW.x); float shore=islR(th);
        float dist = length(uCamPos-vW);
        // normal from wave field
        float e=6.;
        float hC = sin(dot(vW.xz,vec2(.83,.55))*.021+uTime*.00115) + sin(dot(vW.xz,vec2(-.42,.91))*.033+uTime*.0009);
        float hX = sin(dot(vW.xz+vec2(e,0.),vec2(.83,.55))*.021+uTime*.00115) + sin(dot(vW.xz+vec2(e,0.),vec2(-.42,.91))*.033+uTime*.0009);
        float hZ = sin(dot(vW.xz+vec2(0.,e),vec2(.83,.55))*.021+uTime*.00115) + sin(dot(vW.xz+vec2(0.,e),vec2(-.42,.91))*.033+uTime*.0009);
        float nFade = 1.-smoothstep(500., 2600., dist);
        vec3 N = normalize(vec3((hC-hX)*2.2*nFade, 1., (hC-hZ)*2.2*nFade));
        float lag = 1.-smoothstep(shore+30., shore+130., d);        // shallow turquoise apron
        float reef = smoothstep(.55,.85,vn(vW.xz*.012)) * (1.-smoothstep(shore+60.,shore+240.,d))*.5;
        vec3 col = mix(uDeep, uShal, lag*.85+reef);
        // moving caustic sparkle in the shallows
        float ca = vn(vW.xz*.06+vec2(uTime*.004,-uTime*.003));
        col += uShal*ca*ca*.35*lag;
        // sky reflection by fresnel
        vec3 V = normalize(uCamPos-vW);
        float fres = pow(1.-max(dot(V,N),0.), 3.);
        col = mix(col, mix(uSky, uDeep, .55), fres*.42);
        // sun glitter
        vec3 R = reflect(-normalize(uSunDir), N);
        col += uSunCol * pow(max(dot(R,V),0.), 90.) * uSpec;
        col += uSunCol * pow(max(dot(R,V),0.), 9.) * uSpec * .12 * (1.-smoothstep(700., 2400., dist));
        // shoreline foam: lace bands hugging the beach + wave crests outside
        float band = (1.-smoothstep(shore+2., shore+26., d)) * smoothstep(shore-14., shore-2., d);
        float lace = smoothstep(.4,.9, vn(vec2(th*46., d*.09-uTime*.006)) ) * band;
        float ring = smoothstep(shore+8., shore+40., d) * (1.-smoothstep(shore+55., shore+120., d));
        float crest = smoothstep(.78,.96,vCrest) * ring * (.45+.55*smoothstep(.35,.75,vn(vW.xz*vec2(.045,.11)+vec2(uTime*.004,0.))));
        float foam = clamp(lace*1.2 + crest, 0., 1.);
        col = mix(col, vec3(.97,.99,1.), foam*.85);
        // distance fog
        float f2 = 1.-exp(-uFogDen*uFogDen*dist*dist);
        col = mix(col, mix(uFogCol, uSky, .55), f2);
        gl_FragColor = vec4(col,1.); }`});
  waterMesh=new THREE.Mesh(g,m); scene3.add(waterMesh); }

// ---------------- materials helper ----------------
function std(col,rough,opts){ return new THREE.MeshStandardMaterial(Object.assign({color:col,roughness:rough??.9,metalness:0},opts||{})); }
function vc(geo,fn){ const p=geo.attributes.position, cols=new Float32Array(p.count*3), v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const c=fn(v,i); cols[i*3]=c[0];cols[i*3+1]=c[1];cols[i*3+2]=c[2]; }
  geo.setAttribute('color',new THREE.BufferAttribute(cols,3)); return geo; }

// ---------------- rocks (smooth boulders, shore + shallows) ----------------
const ROCK_TH=.55;
function rockGeo(r,seed){ const g=new THREE.IcosahedronGeometry(r,2), p=g.attributes.position, v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i);
    const s=1+.32*(vnoise(v.x*.5+seed,v.y*.5+seed*2)-.5)+.18*(vnoise(v.x*1.7+seed*3,v.z*1.7)-.5);
    v.multiplyScalar(s); v.y*=.78; p.setXYZ(i,v.x,v.y,v.z); }
  vc(g,(q)=>{ const n=vnoise(q.x*.8+seed,q.z*.8); const a=[.58,.55,.5], b=[.42,.4,.38];
    return [a[0]+(b[0]-a[0])*n, a[1]+(b[1]-a[1])*n, a[2]+(b[2]-a[2])*n]; });
  g.computeVertexNormals(); return g; }
const rockMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.92});
function buildRocks(){ const r=rnd(97);
  const put=(x,z,sc,seed,shallow)=>{ const m=new THREE.Mesh(rockGeo(1,seed),rockMat);
    m.position.set(x, shallow? -1.5+sc*.3 : groundY(x,z)+sc*.28, z);
    m.scale.set(sc*(0.8+r()*.5), sc*(0.6+r()*.4), sc*(0.8+r()*.5));

function frondGeo(L,W0,seed){ const SEG=10, pos=[],col=[],idx=[];

  A.torch.visible=act==='signal'&&walker.hasGear; A.ladle.visible=act==='cook'&&walker.hasGear;
  if(walking){ const jog=act==='jog', k=jog?1.6:1;
    A.hips.position.y=14+Math.abs(Math.cos(t*.011))*1.6*k;
    R(A.legL.hip,sw*.7*k,0,0); R(A.legR.hip,sw2*.7*k,0,0);
    R(A.legL.kn,Math.max(0,-sw)*1.1*k,0,0); R(A.legR.kn,Math.max(0,-sw2)*1.1*k,0,0);
    R(A.armL.sh,sw2*.55*k,0,.12); R(A.armR.sh,sw*.55*k,0,-.12);
    R(A.armL.el,-.4,0,0); R(A.armR.el,-.4,0,0);
    R(A.torsoG,.06*k,0,Math.sin(t*.011)*.03); R(A.headG,-.04,Math.sin(t*.003)*.2,0);
    return; }
  const breathe=Math.sin(t*.0016)*.5+.5;
  const base=()=>{ A.hips.position.y=14;
    R(A.legL.hip,0,0,.03); R(A.legR.hip,0,0,-.03); R(A.legL.kn,0,0,0); R(A.legR.kn,0,0,0);
    R(A.armL.sh,.06,0,.14); R(A.armR.sh,.06,0,-.14); R(A.armL.el,-.25,0,0); R(A.armR.el,-.25,0,0);
    R(A.torsoG,0,0,0); R(A.headG,0,0,0); R(A.g,0,0,0); };
  base();
  switch(act){
    case 'fish': A.hips.position.y=7.5;
      R(A.legL.hip,-1.35,0,.1); R(A.legR.hip,-1.35,0,-.1); R(A.legL.kn,1.15,0,0); R(A.legR.kn,1.15,0,0);
      R(A.armR.sh,-1.15,0,-.3); R(A.armR.el,-.5,0,0); R(A.armL.sh,-.3,0,.2);
      R(A.torsoG,.12,0,0); break;
    case 'cook': case 'tend_fire': A.hips.position.y=6;
      R(A.legL.hip,-1.5,0,.5); R(A.legR.hip,-1.5,0,-.5); R(A.legL.kn,1.5,0,0); R(A.legR.kn,1.5,0,0);
      R(A.armR.sh,-.7+breathe*.15,0,-.2); R(A.armL.sh,-.5,0,.2); R(A.torsoG,.2,0,0); break;
    case 'write_bottle': A.hips.position.y=7.5;
      R(A.legL.hip,-1.35,0,.1); R(A.legR.hip,-1.35,0,-.1); R(A.legL.kn,1.15,0,0); R(A.legR.kn,1.15,0,0);
      R(A.armR.sh,-.9,0,-.15); R(A.armR.el,-.7,0,0); R(A.headG,.25,-.2,0); R(A.torsoG,.15,0,0); break;
    case 'sandcastle': case 'raft_work': A.hips.position.y=6.5;
      R(A.legL.hip,-.4,0,.15); R(A.legR.hip,-.4,0,-.15); R(A.legL.kn,2.1,0,0); R(A.legR.kn,2.1,0,0);
      R(A.armL.sh,-.8-breathe*.3,0,.1); R(A.armR.sh,-.8+breathe*.3,0,-.1);
      R(A.torsoG,.55,0,0); R(A.headG,.2,0,0); break;
    case 'gather_wood': A.hips.position.y=10;
      R(A.torsoG,.75,0,0); R(A.armL.sh,-.9,0,.15); R(A.armR.sh,-.5,0,-.15);
      R(A.legL.kn,.3,0,0); R(A.legR.kn,.3,0,0); R(A.headG,-.3,0,0); break;
    case 'coconut': R(A.armR.sh,-2.6,0,-.2); R(A.armR.el,-.4,0,0);
      R(A.armL.sh,-2.6+breathe*.2,0,.2); R(A.headG,-.35,0,0); A.hips.position.y=14.6; break;
    case 'signal': R(A.armR.sh,-2.9,0,-.3); R(A.armL.sh,-2.9,0,.3);
      R(A.headG,-.3,0,0); A.hips.position.y=14.8; break;
    case 'bathe': A.hips.position.y=11;
      R(A.armL.sh,-.5-breathe*.3,0,.3); R(A.armR.sh,-.5+breathe*.3,0,-.3); break;
    case 'nap': case 'sleep': case 'stargaze':
      A.hips.position.y=3.2; R(A.g,0,0,0);
      A.g.rotation.x=-Math.PI/2*.94;
      if(act!=='stargaze'){ R(A.armL.sh,.3,0,.5); R(A.armR.sh,.3,0,-.5);
        R(A.legL.hip,.5,0,.1); R(A.legR.hip,.35,0,-.1); R(A.legL.kn,.8,0,0); R(A.legR.kn,.7,0,0);
        R(A.headG,0,0,.25); }
      else { R(A.armL.sh,-2.4,0,.6); R(A.armR.sh,-2.4,0,-.6); R(A.headG,0,0,0); }
      break;
    default: // stand / idle: weight shift + look around
      R(A.torsoG,0,0,Math.sin(t*.0008)*.05);
      R(A.headG,Math.sin(t*.0011)*.08,Math.sin(t*.0006)*.5,0);
      R(A.armL.sh,.06+breathe*.05,0,.14); R(A.armR.sh,.06+breathe*.05,0,-.14); }
}
// walking locomotion: he really crosses the island between activities
const SPOTS={
  fish:[150,95], gather_wood:[92,-16], raft_work:[108,70], nap:[-54,30],
  sleep:[-30,46], jog:null, coconut:[-56,30], sandcastle:[70,120],
  signal:[-20,-160], cook:[-13,13], write_bottle:[26,150], stargaze:[4,26],
  bathe:[210,80], tend_fire:[-13,13], stand:[10,110] };
const NEAR={
  fish:{x:240,z:150}, gather_wood:{x:95,z:-24}, raft_work:RAFT, coconut:PALM,
  cook:FIRE, tend_fire:FIRE, sandcastle:{x:78,z:128}, signal:{x:-30,z:-450},
  nap:PALM, write_bottle:{x:0,z:340} };
let t0=0;
const walker={x:10,z:110,yaw:0,tx:10,tz:110,walking:false,speed:1.7,waypoint:null,hasGear:false,act:'stand',pickT:0};
function walkerTarget(){ const act=S?S.activity:'stand';
  if(act==='jog'){ const a=Math.sin(t0*.00006)*.9+.2; return {x:70+55*Math.cos(a),z:30+65*Math.sin(a)}; }
  const p=SPOTS[act]||SPOTS.stand; return {x:p[0],z:p[1]}; }
function walkerStep(dt){
  const act=S?S.activity:'stand';
  if(act!==walker.act){ // new activity: gear jobs start with a trip to the chest
    walker.act=act;
    if(GEAR_ACTS.includes(act)){ walker.waypoint={x:CHEST.x+10,z:CHEST.z+4}; walker.hasGear=false; walker.pickT=0; }
    else walker.waypoint=null; }
  let tgt=walkerTarget();
  if(walker.waypoint) tgt=walker.waypoint;
  walker.tx=tgt.x; walker.tz=tgt.z;
  const dx=walker.tx-walker.x, dz=walker.tz-walker.z, d=Math.hypot(dx,dz);
  if(walker.waypoint&&d<5){ // arrived at the chest: bend, grab, walk on
    walker.pickT+=dt;
    if(walker.pickT>1100){ walker.waypoint=null; walker.hasGear=true; } }
  walker.walking=d>4;
  if(walker.walking){
    const want=Math.atan2(dx,dz);
    let dy=want-walker.yaw; while(dy>Math.PI)dy-=6.283; while(dy<-Math.PI)dy+=6.283;
    walker.yaw+=dy*Math.min(1,dt*.006);
    const sp=walker.speed*(S&&S.activity==='jog'?2.2:1)*Math.min(1,Math.max(.3,d/18));
    walker.x+=Math.sin(walker.yaw)*sp; walker.z+=Math.cos(walker.yaw)*sp; }
  return d; }

// ---------------- clouds, horizon islands, gull ----------------
const cloudSprites=[];
function puffTexture(){ const c=document.createElement('canvas'); c.width=256; c.height=128;
  const g=c.getContext('2d');
  for(const [x,y,r] of [[70,80,42],[128,70,52],[186,82,40],[104,90,44],[156,92,42]]){
    const gr=g.createRadialGradient(x,y,4,x,y,r);
    gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(.7,'rgba(255,250,244,.55)'); gr.addColorStop(1,'rgba(255,250,244,0)');
    g.fillStyle=gr; g.fillRect(0,0,256,128); }
  return new THREE.CanvasTexture(c); }
function buildClouds(){ const tex=puffTexture(), r=rnd(41);
  for(let i=0;i<7;i++){ const m=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,opacity:.85,fog:false}));
    const s=(160+r()*220); m.scale.set(s*1.9,s,1);
    m.position.set(-2600+r()*5200, 560+r()*340, -2100-r()*1700);
    scene3.add(m); cloudSprites.push({m,sp:.9+r()*1.2}); } }
function buildHorizonIsles(){ const r=rnd(63);
  const mat=new THREE.MeshBasicMaterial({color:0x7a9ab8,fog:false});
  window.__isleMat=mat;
  for(const [lx,lz,ls] of [[-3100,-2100,1],[3400,-1500,.85],[2100,-3500,.7]]){
    const g=new THREE.Group();
    for(let i=0;i<3;i++){ const h=new THREE.Mesh(new THREE.SphereGeometry(120*ls,16,10),mat);
      h.scale.set(2.4+r(),.16+r()*.12,1); h.position.set((i-1)*170*ls,0,(r()-.5)*120);
      g.add(h); }
    g.position.set(lx,-6,lz); scene3.add(g); } }
let gullFly, gullPerch;
function buildGull(){ const mk=()=>{ const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.SphereGeometry(1.6,10,8),std(0xf4f4f2,.7));
    body.scale.set(1.4,.85,.9); g.add(body);
    const hd=new THREE.Mesh(new THREE.SphereGeometry(.9,8,8),std(0xf4f4f2,.7)); hd.position.set(1.9,.9,0); g.add(hd);
    const bk=new THREE.Mesh(new THREE.ConeGeometry(.32,1.4,6),std(0xe8a83a,.7));
    bk.rotation.z=-Math.PI/2; bk.position.set(3,.85,0); g.add(bk);
    const wings=[];
    for(const s of [-1,1]){ const w=new THREE.Mesh(new THREE.PlaneGeometry(4.4,1.6),std(0xe8e8e6,.8));
      w.material.side=THREE.DoubleSide;
      w.position.set(-.4,.5,1.6*s); w.rotation.x=s*.2; g.add(w); wings.push(w); }
    g.userData.wings=wings; return g; };
  gullFly=mk(); scene3.add(gullFly);
  gullPerch=mk(); gullPerch.scale.set(.9,.9,.9);
  const sp=window.__sentinel;
  gullPerch.position.set(sp.position.x, sp.position.y+3.4, sp.position.z);
  gullPerch.rotation.y=-2.2; scene3.add(gullPerch); }

// ---------------- phase application ----------------
const WATER_COLS={
  dawn:{shal:'#3aa8a4',deep:'#1a3a5e'}, day:{shal:'#3ec2b4',deep:'#11496f'},
  dusk:{shal:'#2e8f8c',deep:'#14355c'}, night:{shal:'#12303e',deep:'#061526'} };
function applyPhase(){ const P=pal(), ph=S?S.phase:'dusk';
  skyU.topColor.value.set(P.sky[0]); skyU.midColor.value.set(P.sky[1]); skyU.botColor.value.set(P.sky[3]);
  scene3.fog.color.set(P.fog); waterU.uFogCol.value.set(P.fog);
  const lv=new THREE.Vector3(...P.lv).normalize();
  sun.position.copy(lv).multiplyScalar(900); sun.target.position.set(0,0,0);
  sun.color.set(P.sun); sun.intensity=P.sunI;
  sun.castShadow=ph!=='night';
  hemi.color.set(P.hemi); hemi.groundColor.set(0x8a7355); hemi.intensity=P.amb;
  waterU.uSunDir.value.copy(lv); waterU.uSunCol.value.set(P.sun);
  waterU.uSky.value.set(P.sky[2]); waterU.uSpec.value=P.spec;
  const wc=WATER_COLS[ph]||WATER_COLS.day;
  waterU.uShal.value.set(wc.shal); waterU.uDeep.value.set(wc.deep);
  window.__stars.material.opacity=ph==='night'?.85:ph==='dusk'?.18:0;
  sunSpr.visible=ph!=='night'; moonSpr.visible=ph==='night';
  sunSpr.position.copy(lv).multiplyScalar(3300); moonSpr.position.set(-1350,1500,-1450);
  const cl=S&&S.weather==='cloudy'?.4:1;
  for(const c of cloudSprites){ c.m.material.opacity=(ph==='night'?.16:ph==='dusk'?.55:.85)*cl;
    c.m.material.color.set(ph==='dusk'?0xffd0a0:ph==='night'?0x8899bb:0xffffff); }
  if(window.__isleMat) window.__isleMat.color.set(ph==='night'?0x141f33:ph==='dusk'?0x5c4458:ph==='dawn'?0x6a5a72:0x6f94ad);
  if(fireLight) fireLight.intensity=(S&&S.world.fire_lit)? 1.6+Math.sin(t0*.03)*.4+Math.sin(t0*.017)*.2 : 0;
  if(fireFlame) fireFlame.visible=!!(S&&S.world.fire_lit);
  if(window.__fireInner) window.__fireInner.visible=!!(S&&S.world.fire_lit);
  if(chestGlow){ const open=S&&GEAR_ACTS.includes(S.activity)&&walker.waypoint&&Math.hypot(walker.x-CHEST.x,walker.z-CHEST.z)<22;
    chestGlow.intensity=open?1.4:0;
    if(chestLid) chestLid.rotation.x+= ((open?-1.9:0)-chestLid.rotation.x)*.08; } }

// ---------------- camera ----------------
let camAng=.6, camDrift=0;
function camUpdate(){ camDrift+=.00016;
  if(new URLSearchParams(location.search).has('wadecam')){
    const wx=walker.x, wz=walker.z, gy=groundY(wx,wz), f=wadeMesh.g.rotation.y;
    camera.position.set(wx+Math.sin(f)*105, gy+42, wz+Math.cos(f)*105);
    camera.lookAt(wx,gy+20,wz); return; }
  const base=Math.atan2(walker.x,300);
  const want=base+Math.sin(camDrift)*.95;
  camAng+=(want-camAng)*.02;
  const phone=W<700, R=phone?760:640;
  camera.position.set(Math.sin(camAng)*R,(phone?210:165)+Math.sin(camDrift*.7)*8,Math.cos(camAng)*R);
  camera.lookAt(0,58,0); }

// ---------------- 2D overlay: thought bubble, Zs, rain ----------------
function project(x,y,z){ const v=new THREE.Vector3(x,y,z).project(camera);
  if(v.z>1) return null; return {x:(v.x+1)/2*W, y:(1-v.y)/2*H}; }
function drawOverlay(t){ fxctx.clearRect(0,0,W,H);
  if(!S) return;
  const head=wadeMesh.headG.getWorldPosition(new THREE.Vector3());
  if(S.weather==='rain'||S.weather==='storm'){
    fxctx.strokeStyle='rgba(180,200,220,.4)'; fxctx.lineWidth=1;
    const n=W<700?60:120;
    for(let i=0;i<n;i++){ const x=((i*97)+t*.7)%W, y=((i*61)+t*1.9)%H;
      fxctx.beginPath(); fxctx.moveTo(x,y); fxctx.lineTo(x-3,y+11); fxctx.stroke(); }
    if(S.weather==='storm'&&Math.floor(t/4200)!==Math.floor((t-16)/4200)&&Math.random()<.3){
      fxctx.fillStyle='rgba(220,230,255,.28)'; fxctx.fillRect(0,0,W,H); } }
  if((S.activity==='sleep'||S.activity==='nap')){
    const hp=project(head.x,head.y+10,head.z);
    if(hp){ fxctx.fillStyle='#fff'; fxctx.textAlign='center'; fxctx.textBaseline='middle';
      for(let i=0;i<3;i++){ const zp=((t*.0004)+i/3)%1;
        fxctx.globalAlpha=zp<.15?zp/.15*.9:Math.max(0,(1-zp))*1.1;
        fxctx.font='bold '+(10+i*5)+'px monospace';
        fxctx.fillText('z', hp.x+12+i*9+zp*9, hp.y-4-zp*40-i*5); }
      fxctx.globalAlpha=1; } }
  if(S.thought){
    const hp=project(head.x,head.y+6,head.z);
    if(hp){ fxctx.font='15px serif'; const tw=fxctx.measureText(S.thought).width;
      const bw2=Math.min(tw+26,W*.8), bh=34;
      const bx=Math.min(Math.max(hp.x+10,bw2/2+8),W-bw2/2-8), by=Math.max(hp.y-64,bh/2+8);
      fxctx.fillStyle='rgba(255,255,255,.92)';
      fxctx.beginPath(); fxctx.roundRect(bx-bw2/2,by-bh/2,bw2,bh,16); fxctx.fill();
      fxctx.beginPath(); fxctx.arc(bx-bw2/2+12,by+bh/2+8,6,0,7); fxctx.fill();
      fxctx.beginPath(); fxctx.arc(hp.x+4,hp.y-6,3.5,0,7); fxctx.fill();
      fxctx.fillStyle='#333'; fxctx.textAlign='center'; fxctx.textBaseline='middle';
      fxctx.fillText(S.thought,bx,by+1); } } }

// ---------------- build + frame ----------------
let wadeMesh, lastT=0;
buildIsland(); buildWater(); buildRocks(); buildPalm(); buildChest(); buildFirePit(); buildProps();
buildRaftPile(); buildClouds(); buildHorizonIsles(); buildGull();
wadeMesh=buildWadeMesh();
let raftProg=-1;
function frame(t){ t0=t;
  const dt=Math.min(80,t-lastT); lastT=t;
  waterU.uTime.value=t;
  waterU.uTide.value=S?(S.tide==='high'?2.5:S.tide==='low'?-2:0):0;
  if(S&&S.world.raft_progress!==raftProg){ raftProg=S.world.raft_progress; }
  walkerStep(dt);
  const gy=groundY(walker.x,walker.z);
  const act=S?S.activity:'stand';
  const lying=['nap','sleep','stargaze'].includes(act)&&!walker.walking;
  wadeMesh.g.position.set(walker.x, lying?gy+1.2:gy, walker.z);
  const near=NEAR[act];
  const face=walker.walking? walker.yaw : (near? Math.atan2(near.x-walker.x,near.z-walker.z) : walker.yaw);
  wadeMesh.g.rotation.y=face;
  poseWade(wadeMesh,walker.waypoint&&!walker.walking?'gather_wood':act,t,walker.walking);
  if(walker.waypoint&&!walker.walking){ wadeMesh.heldLog.visible=false; }
  // gull circles the lagoon, wings flapping
  const ga=t*.00035;
  gullFly.position.set(Math.cos(ga)*300, 90+Math.sin(t*.0009)*22, Math.sin(ga)*300);
  gullFly.rotation.y=-ga+Math.PI/2;
  const flap=Math.sin(t*.012)*.7;
  gullFly.userData.wings[0].rotation.x=.25+flap; gullFly.userData.wings[1].rotation.x=-.25-flap;
  // palm sway
  for(const f of window.__fronds) f.m.rotation.z=f.base+Math.sin(t*.0009+f.ph)*.045;
  // clouds drift
  for(const c of cloudSprites){ c.m.position.x+=c.sp*.05; if(c.m.position.x>2600) c.m.position.x=-2600; }
  camUpdate();
  waterU.uCamPos.value.copy(camera.position);
  applyPhase();
  renderer.render(scene3,camera);
  drawOverlay(t);
  requestAnimationFrame(frame); }
resize();
requestAnimationFrame(frame);
</script>
<script>
// ---------------- UI ----------------
const $=id=>document.getElementById(id);
function fmt(iso){ const d=new Date(iso);
  return d.toLocaleDateString(undefined,{weekday:'short'})+' '+
         d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderUI(){
  if(!S)return;
  $('chap').textContent=`Day ${S.island_day} · Cycle ${S.cycle} · ${S.chapter}`;
  $('meta').innerHTML=`${S.phase} · ${S.weather} · tide ${S.tide}<br>${S.moon.name}`;
  const latest=(S.recent||[]).slice(-1)[0];
  $('ticker').textContent = latest? latest.text : 'A tiny island. One guy. Somewhere, a story is starting.';
  $('loglist').innerHTML=(S.recent||[]).slice().reverse().map(e=>
    `<div class="ev ${e.kind}"><time>${fmt(e.iso)}</time>${esc(e.text)}</div>`).join('');
  const n=S.needs;
  $('stats').innerHTML=`<div class="needs">`+
    ['hunger','energy','mood','boredom','loneliness'].map(k=>
      `${k} <span class="bar"><i style="width:${n[k]}%"></i></span>${n[k]}`).join('<br>')+
    `<br><br>doing: ${esc(S.activity_label)}<br>raft ${S.world.raft_progress}% · wood ${S.world.wood} · coconuts ${S.world.coconuts}`+
    (S.state_line?`<br><br><span style="opacity:.6">${esc(S.state_line)}</span>`:'')+`</div>`;
  $('miles').innerHTML=(S.milestones||[]).map(m=>
    `<div class="ev milestone">★ ${esc(m.label)}<time>day ${m.day}, cycle ${m.cycle}</time></div>`).join('')||
    '<div class="ev">No firsts yet. Wade is just getting started.</div>';
  if(S.catchup && S.catchup.length>0){
    $('cuhead').textContent=`WHILE YOU WERE AWAY (${S.catchup.length})`;
    $('culist').innerHTML=S.catchup.map(e=>
      `<div class="ev ${e.kind}"><time>${fmt(e.iso)}</time>${esc(e.text)}</div>`).join('');
    $('catchup').classList.add('open');
  }
}

async function poll(){
  try{
    const q=lastVisit?`?since=${encodeURIComponent(lastVisit)}`:'';
    const r=await fetch('/api/state'+q);
    S=await r.json();
    try{ localStorage.setItem('shipwrecked_last', new Date().toISOString()); }catch(e){}
    lastVisit=null; // catch-up only on first load of a visit
    renderUI();
  }catch(e){ /* island weathered the disconnect; try again next tick */ }
}
poll(); setInterval(poll, 30000);

$('logbtn').onclick=()=>$('drawer').classList.toggle('open');
$('closebtn').onclick=()=>$('drawer').classList.remove('open');
$('cubtn').onclick=()=>$('catchup').classList.remove('open');
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shipwrecked - a tiny island story</title>
<style>
  :root { --ink:#f4ead5; --dim:#c8b98f; --panel:rgba(12,20,32,.82); }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; overflow:hidden; background:#0b1c2c;
    font-family:'Courier New', ui-monospace, monospace; color:var(--ink); }
  canvas#scene, canvas#fx { position:fixed; inset:0; width:100%; height:100%; display:block; }
  canvas#fx { pointer-events:none; }
  .hud { position:fixed; z-index:5; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #title { top:10px; left:14px; }
  #title h1 { font-size:20px; letter-spacing:3px; }
  #title .sub { font-size:12px; color:var(--dim); margin-top:2px; }
  #meta { top:10px; right:14px; text-align:right; font-size:12px; color:var(--dim); line-height:1.5; }
  #ticker { left:0; right:0; bottom:0; padding:8px 14px; font-size:13px;
    background:linear-gradient(transparent, rgba(5,10,18,.85)); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #logbtn { bottom:44px; right:14px; background:var(--panel); border:1px solid #3a4a5e;
    color:var(--ink); font:inherit; font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer; }
  #drawer { left:0; right:0; bottom:0; max-height:62%; background:var(--panel);
    border-top:1px solid #3a4a5e; transform:translateY(100%); transition:transform .25s;
    display:flex; flex-direction:column; z-index:9; }
  #drawer.open { transform:translateY(0); }
  #drawer header { padding:10px 14px; display:flex; justify-content:space-between; align-items:center; }
  #drawer header b { letter-spacing:2px; font-size:13px; }
  #drawer header button { background:none; border:none; color:var(--ink); font:inherit; font-size:18px; cursor:pointer; }
  #drawer .cols { display:flex; gap:14px; overflow:auto; padding:0 14px 14px; }
  #drawer .col { flex:1; min-width:0; }
  #drawer h3 { font-size:11px; color:var(--dim); letter-spacing:1px; margin:6px 0; }
  #drawer .ev { font-size:12px; padding:5px 0; border-bottom:1px dashed #2a3a4e; line-height:1.45; }
  #drawer .ev time { color:var(--dim); font-size:11px; display:block; }
  #drawer .ev.story { color:#ffd98a; } #drawer .ev.milestone { color:#9ae6a0; }
  #drawer .ev.holiday { color:#f0a0c0; } #drawer .ev.event { color:#a0c8f0; }
  .needs { font-size:11px; color:var(--dim); }
  .needs .bar { display:inline-block; width:70px; height:7px; background:#223144;
    border-radius:4px; overflow:hidden; vertical-align:middle; margin:0 6px 0 2px; }
  .needs .bar i { display:block; height:100%; background:#e0b35c; }
  #catchup { position:fixed; inset:0; z-index:20; display:none; align-items:center;
    justify-content:center; background:rgba(4,8,14,.72); padding:16px; }
  #catchup.open { display:flex; }
  #catchup .card { background:var(--panel); border:1px solid #3a4a5e; border-radius:12px;
    max-width:560px; width:100%; max-height:78vh; overflow:auto; padding:18px; }
  #catchup h2 { font-size:15px; letter-spacing:1px; margin-bottom:10px; }
  #catchup .ev { font-size:13px; padding:6px 0; border-bottom:1px dashed #2a3a4e; line-height:1.5; }
  #catchup .ev time { color:var(--dim); font-size:11px; display:block; }
  #catchup .ev.story { color:#ffd98a; } #catchup .ev.milestone { color:#9ae6a0; }
  #catchup .ev.holiday { color:#f0a0c0; } #catchup .ev.event { color:#a0c8f0; }
  #catchup button { margin-top:12px; width:100%; padding:10px; font:inherit; font-size:13px;
    letter-spacing:2px; background:#e0b35c; border:none; border-radius:8px; color:#1a1206; cursor:pointer; }
  @media (max-width:640px){
    #title h1 { font-size:16px; } #meta { font-size:11px; }
    #drawer .cols { flex-direction:column; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="fx"></canvas>
<div class="hud" id="title"><h1>SHIPWRECKED</h1><div class="sub" id="chap">Day 1 · Landfall</div></div>
<div class="hud" id="meta"></div>
<div class="hud" id="ticker"></div>
<button class="hud" id="logbtn">STORY LOG</button>
<div class="hud" id="drawer">
  <header><b>THE STORY SO FAR</b><button id="closebtn" aria-label="close">×</button></header>
  <div class="cols">
    <div class="col"><h3>LOG</h3><div id="loglist"></div></div>
    <div class="col"><h3>WADE</h3><div id="stats"></div><h3>MILESTONES</h3><div id="miles"></div></div>
  </div>
</div>
<div id="catchup"><div class="card"><h2 id="cuhead">WHILE YOU WERE AWAY</h2><div id="culist"></div>
  <button id="cubtn">BACK TO THE ISLAND</button></div></div>


<script>
"use strict";
const cv = document.getElementById('scene'), fx = document.getElementById('fx');
const gl = cv.getContext('webgl', {antialias:true, alpha:false});
const fxctx = fx.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){ DPR = Math.min(devicePixelRatio||1, 1.75);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; fx.width = W*DPR; fx.height = H*DPR;
  cv.style.width = fx.style.width = W+'px'; cv.style.height = fx.style.height = H+'px';
  fxctx.setTransform(DPR,0,0,DPR,0,0);
  if(gl) gl.viewport(0,0,cv.width,cv.height); }
addEventListener('resize', resize);

let S = null;            // server state
let lastVisit = null;
try { lastVisit = localStorage.getItem('shipwrecked_last'); } catch(e){}

function rnd(seed){ let x=seed; return ()=>{ x=(x*1103515245+12345)&0x7fffffff; return x/0x7fffffff; }; }
const isNight=()=>S&&S.phase==='night';
const PAL={
  dawn:{sky:['#2e3a66','#7a5a8a','#e8935a','#f7cf8e'],fog:[.55,.42,.5],sun:[1,.72,.45],amb:.34,lv:[-.55,.4,.35],spec:.5},
  day:{sky:['#3f8fd2','#7ec3e8','#c9ecf5','#eafbff'],fog:[.62,.82,.92],sun:[1,.95,.8],amb:.34,lv:[.45,.62,.45],spec:.85},
  dusk:{sky:['#232048','#6e3a63','#d96a4e','#f2a65e'],fog:[.5,.35,.45],sun:[1,.55,.35],amb:.3,lv:[.6,.3,.4],spec:.7},
  night:{sky:['#040814','#0a1430','#101f3e','#16294a'],fog:[.05,.09,.18],sun:[.5,.58,.75],amb:.16,lv:[-.35,.45,.5],spec:.5},
};
const pal=()=>PAL[S?S.phase:'day']||PAL.day;

if(!gl){ document.getElementById('ticker').textContent='This island needs WebGL to render.'; }

// ---------------- mesh builders (shared-vert triangles) ----------------
let verts=[], faces=[];
function V(x,y,z){ verts.push([x,y,z]); return verts.length-1; }
function F(a,b,c,col,emis){ faces.push({v:[a,b,c],col,emis:emis||0}); }
function quad(a,b,c,d,col,emis){ F(a,b,c,col,emis); F(a,c,d,col,emis); }
function box(cx,cy,cz,sx,sy,sz,col,ry,emis){
  const x=sx/2,y=sy/2,z=sz/2, cs=ry?Math.cos(ry):1, sn=ry?Math.sin(ry):0;
  const P=[[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],[-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]];
  const ids=P.map(p=>{ const px=p[0]*cs-p[2]*sn, pz=p[0]*sn+p[2]*cs;
    return V(cx+px,cy+p[1],cz+pz); });
  quad(ids[3],ids[2],ids[1],ids[0],col,emis); quad(ids[7],ids[5],ids[6],ids[4],col,emis);
  quad(ids[1],ids[5],ids[4],ids[0],col,emis); quad(ids[7],ids[6],ids[2],ids[3],col,emis);
  quad(ids[2],ids[6],ids[5],ids[1],col,emis); quad(ids[4],ids[7],ids[3],ids[0],col,emis); }
function prism(x0,y0,z0,x1,y1,z1,w,col){
  // robust 4-sided tube between two points, any orientation
  let dx=x1-x0, dy=y1-y0, dz=z1-z0; const dl=Math.hypot(dx,dy,dz)||1; dx/=dl; dy/=dl; dz/=dl;
  let ux=-dz, uy=0, uz=dx; let ul=Math.hypot(ux,uy,uz);
  if(ul<.25){ ux=1; uy=0; uz=0; ul=1; }
  ux/=ul; uy/=ul; uz/=ul;
  const vx=dy*uz-dz*uy, vy=dz*ux-dx*uz, vz=dx*uy-dy*ux;
  const c=(px,py,pz,s)=>V(px+(ux*s+vx*s)*0+ux*s*w, py+(uy*s+vy*s)*0+uy*s*w, pz+(uz*s+vz*s)*0+uz*s*w);
  const A=[V(x0+(ux+vx)*w,y0+(uy+vy)*w,z0+(uz+vz)*w), V(x0+(ux-vx)*w,y0+(uy-vy)*w,z0+(uz-vz)*w),
           V(x0-(ux-vx)*w,y0-(uy-vy)*w,z0-(uz-vz)*w), V(x0-(ux+vx)*w,y0-(uy+vy)*w,z0-(uz+vz)*w)];
  const B=[V(x1+(ux+vx)*w*.8,y1+(uy+vy)*w*.8,z1+(uz+vz)*w*.8), V(x1+(ux-vx)*w*.8,y1+(uy-vy)*w*.8,z1+(uz-vz)*w*.8),
           V(x1-(ux-vx)*w*.8,y1-(uy-vy)*w*.8,z1-(uz-vz)*w*.8), V(x1-(ux+vx)*w*.8,y1-(uy+vy)*w*.8,z1-(uz+vz)*w*.8)];
  for(let i=0;i<4;i++){ const j=(i+1)%4; quad(A[j],A[i],B[i],B[j],col); }
  quad(A[0],A[1],A[2],A[3],col); quad(B[3],B[2],B[1],B[0],col); }

// ---------------- island geometry ----------------
const ISL_R=195;
function islR(th){ return ISL_R*(1+.13*Math.sin(3*th+1.1)+.07*Math.sin(7*th+.4)); }
function islH(f){ return 48*Math.pow(Math.max(0,1-f*f),.75); }
function groundY(x,z){ const d=Math.hypot(x,z);
  const f=Math.min(1,d/islR(Math.atan2(z,x))); return 2+islH(f); }

function buildIsland(){ const r=rnd(31), K=13, J=52, rings=[];
  // the grass line wobbles around the dome instead of following a ring
  const grassEdge=th=>.3+.09*Math.sin(3*th+.7)+.05*Math.sin(7*th+2.1);
  for(let k=0;k<=K;k++){ const f=k/K, ring=[];
    for(let j=0;j<J;j++){ const th=j/J*Math.PI*2, R=islR(th)*f;
      // gentle deterministic dune noise so the dome is not a perfect cone
      const bump=(k>0&&k<K)? Math.sin(th*5+k*2.1)*1.4*f : 0;
      ring.push(V(Math.cos(th)*R, 2+islH(f)+bump, Math.sin(th)*R)); }
    rings.push(ring); }
  const h2=(k,j)=>{ const x=Math.sin(k*127.1+j*311.7)*43758.5453; return x-Math.floor(x); };
  for(let k=0;k<K;k++) for(let j=0;j<J;j++){ const j2=(j+1)%J;
    const th=(j+.5)/J*Math.PI*2, f=(k+.5)/K, ge=grassEdge(th), h=h2(k,j);
    let col;
    if(f<ge){ // grassy heart in two sun-lit tones
      col=(h<.5?[.6,.72,.38]:[.66,.77,.41]).map(c=>c*(1+(h2(j,k)-.5)*.05));
    } else if(f<ge+.09){ // scruffy band where the grass gives up to sand
      col=[.8,.75,.46].map(c=>c*(1+(h-.5)*.06));
    } else { // open sand: warm base with speckle, flecks and wind ripples
      col=[.93,.8,.55].map(c=>c*(1+(h-.5)*.045));
      if(h2(k*3,j*7)>.965) col=col.map(c=>c*.94);
      if(f>.5&&Math.sin(f*46+Math.sin(th*4)*1.2)>.72) col=col.map(c=>c*.955);
      if(f>.9) col=[.8,.66,.44].map(c=>c*(1+(h-.5)*.05)); // wet band at the waterline
      if(f>.96) col=[.72,.58,.38]; }
    quad(rings[k][j],rings[k][j2],rings[k+1][j2],rings[k+1][j],col); }
  const rim=rings[K], s1=[], s2=[];
  for(let j=0;j<J;j++){ const th=j/J*Math.PI*2, R=islR(th);
    s1.push(V(Math.cos(th)*(R+8), -9, Math.sin(th)*(R+8)));
    s2.push(V(Math.cos(th)*(R+2), -26, Math.sin(th)*(R+2))); }
  for(let j=0;j<J;j++){ const j2=(j+1)%J;
    quad(rim[j],s1[j],s1[j2],rim[j2],[.72,.56,.34]);
    quad(s1[j],s2[j],s2[j2],s1[j2],[.56,.44,.29]); }
  // grass tufts stay inside the green core
  for(let i=0;i<46;i++){ const a=r()*Math.PI*2, d=r()*ISL_R*grassEdge(a)*.95;
    const gx=Math.cos(a)*d, gz=Math.sin(a)*d, gcol=i%3?[.34,.52,.26]:[.42,.6,.28];
    for(let b=0;b<3;b++){ const bx=gx+(r()-.5)*5, bz=gz+(r()-.5)*5, by=groundY(bx,bz);
      F(V(bx-.7,by,bz), V(bx+.7,by,bz), V(bx+(r()-.5)*2, by+2.6+r()*1.8, bz+(r()-.5)*2), gcol); } } }

// smooth shoreline boulders; the sentinel rock is the gull's perch
const ROCK_TH=.55;
function buildRocks(){ const r=rnd(97);
  for(const cl of [{th:ROCK_TH,n:5,s:1},{th:2.35,n:4,s:.8},{th:4.35,n:6,s:1.15}]){
    for(let i=0;i<cl.n;i++){ const a=cl.th+(r()-.5)*.22, d=islR(a)*(.98+r()*.1);
      const x=Math.cos(a)*d, z=Math.sin(a)*d, sc=(3.5+r()*6.5)*cl.s;
      sph(x, groundY(x,z)+sc*.3, z, sc, sc*(.55+r()*.3), sc*(.75+r()*.35),
        [.52,.53,.55].map(c=>c*(.8+r()*.45)), 9,6); } }
  const sx=Math.cos(ROCK_TH)*islR(ROCK_TH)*1.02, sz=Math.sin(ROCK_TH)*islR(ROCK_TH)*1.02;
  sph(sx, groundY(sx,sz)+2, sz, 10, 7.5, 9, [.48,.49,.51], 10,7); }

// ---------------- water grid (static positions, GPU waves) ----------------
const WN=64, WSPAN=6000;
function wmap(s){ const half=WSPAN/2; return Math.sign(s)*half*Math.pow(Math.abs(s),2.6); }
let waterPos=null, waterIdx=null;
function buildWater(){ const n=WN+1;
  waterPos=new Float32Array(n*n*3);
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    waterPos[(i*n+j)*3]=wmap(i/WN*2-1); waterPos[(i*n+j)*3+1]=0; waterPos[(i*n+j)*3+2]=wmap(j/WN*2-1); }
  const idx=[];
  for(let i=0;i<WN;i++) for(let j=0;j<WN;j++){ const a=i*n+j,b=a+1,c=a+n,d=c+1;
    idx.push(a,b,c, b,d,c); }
  waterIdx=new Uint16Array(idx); }

// ---------------- props ----------------
const FIRE={x:-16,z:34}, PALM={x:-62,z:24}, RAFT={x:118,z:78}, CHEST={x:-26,z:42};
function buildPalm(){ const px=PALM.x,pz=PALM.z, py=groundY(px,pz);
  // leaning trunk with a dark bark ring at every joint
  let cx=px,cy=py,cz=pz;
  for(let i=0;i<7;i++){ const f=i/7;
    const nx=px+26*f*f, ny=py+(i+1)*7.6, nz=pz+7*f*f;
    prism(cx,cy,cz,nx,ny,nz, 5-f*2, i%2?[.6,.43,.27]:[.52,.36,.22]);
    prism(nx,ny-1.2,nz, nx,ny+.6,nz, 4.9-f*2, [.4,.28,.17]);
    cx=nx; cy=ny; cz=nz; }
  // fronds arch out and droop, lighter on top, with a center rib
  const r=rnd(77);
  for(let i=0;i<16;i++){ const a=i/16*Math.PI*2+r()*.2, L=38+(i%3)*5+r()*5;
    const ex=cx+Math.cos(a)*L, ez=cz+Math.sin(a)*L, ey=cy+4-L*.45;
    const mx=cx+Math.cos(a)*L*.5, mz=cz+Math.sin(a)*L*.5, my=cy+9;
    const w=8, ax=Math.cos(a+Math.PI/2)*w, az=Math.sin(a+Math.PI/2)*w;
    F(V(cx,cy,cz),V(mx+ax,my,mz+az),V(ex,ey,ez),[.3+(i%2)*.04,.6,.25]);
    F(V(cx,cy,cz),V(ex,ey,ez),V(mx-ax,my,mz-az),[.22,.47,.18]);
    prism(cx,cy+.4,cz, ex,ey,ez, .5, [.25,.5,.22]); }
  // young spears still standing up in the middle
  for(let i=0;i<4;i++){ const a=i/4*Math.PI*2+.6;
    F(V(cx,cy,cz),V(cx+Math.cos(a+.3)*3,cy+16,cz+Math.sin(a+.3)*3),
      V(cx+Math.cos(a)*7,cy+13,cz+Math.sin(a)*7),[.42,.68,.3]); }
  // coconuts tucked under the crown
  for(const [ox,oy,oz] of [[-3.4,1.6,1.8],[2.8,2.2,-1.2],[0,3.2,1.4]]){
    const c1=V(cx+ox-2.4,cy+oy,cz+oz), c2=V(cx+ox+2.4,cy+oy,cz+oz), c3=V(cx+ox,cy+oy+4.4,cz+oz),
          c4=V(cx+ox,cy+oy-1.7,cz+oz+2.6), c5=V(cx+ox,cy+oy-1.7,cz+oz-2.6);
    F(c1,c3,c4,[.42,.3,.16]); F(c2,c4,c3,[.42,.3,.16]); F(c1,c5,c3,[.42,.3,.16]); F(c2,c3,c5,[.42,.3,.16]); }
  // fern skirt around the trunk
  for(let f=0;f<6;f++){ const fa=f/6*Math.PI*2+.4, fx=px+Math.cos(fa)*7, fz=pz+Math.sin(fa)*7, fy=groundY(fx,fz);
    for(let b=0;b<5;b++){ const ba=fa+(b-2)*.35;
      F(V(fx,fy,fz), V(fx+Math.cos(ba-.12)*9,fy+2.5,fz+Math.sin(ba-.12)*9),
        V(fx+Math.cos(ba)*11,fy+1,fz+Math.sin(ba)*11), b%2?[.28,.53,.23]:[.23,.46,.19]); } } }
function buildProps(){ const r=rnd(51);
  // sun-bleached driftwood half buried on the way to the wood pile
  const x1=95,z1=-24, gy=groundY(x1,z1);
  prism(x1-9,gy+1.4,z1, x1+7,gy+2.8,z1+4, 2,[.45,.36,.27]);
  prism(x1+3,gy+2.6,z1+1.8, x1+8,gy+6.5,z1+3, .9,[.41,.33,.25]);
  // the gull keeps watch from the sentinel boulder
  const gx=Math.cos(ROCK_TH)*islR(ROCK_TH)*1.02, gz=Math.sin(ROCK_TH)*islR(ROCK_TH)*1.02,
        gyy=groundY(gx,gz)+10.7;
  box(gx,gyy,gz, 3.4,2.4,2.2,[.95,.95,.93],.5);
  box(gx+1.8,gyy+1.6,gz+.8, 1.8,1.8,1.8,[.95,.95,.93],.5);
  F(V(gx+2.8,gyy+1.6,gz+.8),V(gx+4.6,gyy+1.3,gz+1.1),V(gx+2.8,gyy+1.1,gz+.8),[.91,.63,.19]);
  // shells scattered down the beach
  for(let i=0;i<11;i++){ const a=r()*Math.PI*2, d=ISL_R*(.55+r()*.4);
    box(Math.cos(a)*d,groundY(Math.cos(a)*d,Math.sin(a)*d)+.7,Math.sin(a)*d, 2.6,1.3,2.6, [.91,.78,.75],r()*3); }
  // starfish: one by the fire path, one on the wet sand
  for(const [fx2,fz] of [[-34,58],[150,110]]){
    const fy=groundY(fx2,fz);
    for(let i=0;i<5;i++){ const a=i/5*Math.PI*2;
      F(V(fx2+Math.cos(a+.5)*2,fy+1,fz+Math.sin(a+.5)*2), V(fx2+Math.cos(a)*6,fy+.6,fz+Math.sin(a)*6),
        V(fx2+Math.cos(a-.5)*2,fy+1,fz+Math.sin(a-.5)*2), [.85,.42,.31]); } }
  // the bottle that started it all, waiting by the writing spot
  const bx=30,bz=140, by=groundY(bx,bz);
  box(bx,by+1.4,bz, 2.4,4.4,2.4,[.48,.71,.55],.5);
  box(bx+.8,by+4.4,bz+.4, 1.2,2,1.2,[.48,.71,.55],.5);
  box(bx+1,by+5.6,bz+.5, 1.3,1.2,1.3,[.78,.63,.31],.5); }
function buildSandcastle(x,z){ const gy=groundY(x,z);
  box(x,gy+2,z, 7,4,7,[.89,.77,.5],.3); box(x,gy+5.4,z, 4.4,2.8,4.4,[.91,.8,.53],.3);
  for(const [ox,oz] of [[-3.5,-3.5],[3.5,-3.5],[-3.5,3.5],[3.5,3.5]])
    box(x+ox,gy+5,z+oz, 2,3.4,2,[.89,.77,.5],.3);
  prism(x,gy+6.8,z, x,gy+10,z, .3,[.59,.43,.24]);
  F(V(x,gy+10,z),V(x+2.6,gy+9,z),V(x,gy+8.2,z),[.78,.31,.24]); }
function buildPumpkin(x,z){ const gy=groundY(x,z);
  box(x,gy+3,z, 6,5,6,[.88,.5,.19],.4); box(x,gy+6,z, 1.4,2,1.4,[.35,.47,.2],.4);
  F(V(x-2,gy+3.6,z+3.05),V(x-.6,gy+3.6,z+3.05),V(x-1.3,gy+2.6,z+3.05),[.16,.1,.04]);

  if((S.activity==='sleep'||S.activity==='nap')&&wadeHead){
    const hp=project(wadeHead.head.x,wadeHead.head.y+7,wadeHead.head.z);
    if(hp){ fxctx.fillStyle='#fff'; fxctx.textAlign='center'; fxctx.textBaseline='middle';
      for(let i=0;i<3;i++){ const zp=((t*.0004)+i/3)%1;
        fxctx.globalAlpha=zp<.15?zp/.15* .9:Math.max(0,(1-zp))*1.1;
        fxctx.font='bold '+(10+i*5)+'px monospace';
        fxctx.fillText('z', hp.x+12+i*9+zp*9, hp.y-4-zp*40-i*5); }
      fxctx.globalAlpha=1; } }
  // thought bubble
  if(S.thought&&wadeHead){
    const hp=project(wadeHead.head.x,wadeHead.head.y,wadeHead.head.z);
    if(hp){ fxctx.font='15px serif'; const tw=fxctx.measureText(S.thought).width;
      const bw2=Math.min(tw+26,W*.8), bh=34;
      const bx=Math.min(Math.max(hp.x+10,bw2/2+8),W-bw2/2-8), by=Math.max(hp.y-64,bh/2+8);
      fxctx.fillStyle='rgba(255,255,255,.92)';
      fxctx.beginPath(); fxctx.roundRect(bx-bw2/2,by-bh/2,bw2,bh,16); fxctx.fill();
      fxctx.beginPath(); fxctx.arc(bx-bw2/2+12,by+bh/2+8,6,0,7); fxctx.fill();
      fxctx.beginPath(); fxctx.arc(hp.x+4,hp.y-6,3.5,0,7); fxctx.fill();
      fxctx.fillStyle='#333'; fxctx.textAlign='center'; fxctx.textBaseline='middle';
      fxctx.fillText(S.thought,bx,by+1); } }
}
function frame(t){
  t0=t;
  if(gl){
    if(S) rebuildDynamic();
    camUpdate();
    const P=pal(), night=isNight();
    const fogCol=P.fog, fogDen=.0007;
    gl.clearColor(fogCol[0],fogCol[1],fogCol[2],1);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    const sun=P.sun, amb=P.amb;
    const lv=P.lv; const ll=Math.hypot(lv[0],lv[1],lv[2]); const ld=[lv[0]/ll,lv[1]/ll,lv[2]/ll];
    const fireOn=S?S.world.fire_lit:false;
    const flick=fireOn?(.8+.2*Math.sin(t*.03)+.1*Math.sin(t*.017)):0;
    const firePos=[FIRE.x,groundY(FIRE.x,FIRE.z)+4,FIRE.z];
    const fireCol=[1,.45,.15].map(c=>c*flick*1.1);
    // water
    gl.useProgram(progWater);
    gl.uniformMatrix4fv(locW.uProj,false,projM); gl.uniformMatrix4fv(locW.uView,false,viewM);
    gl.uniform1f(locW.uTime,t); gl.uniform1f(locW.uTide,S?(S.tide==='high'?2.5:S.tide==='low'?-2:0):0);
    gl.uniform3fv(locW.uLDir,ld);
    gl.uniform3fv(locW.uSun,sun.map(c=>c*(night?.5:.78)));
    gl.uniform3fv(locW.uAmb,[amb,amb,amb]);
    gl.uniform3fv(locW.uFogCol,fogCol); gl.uniform3fv(locW.uCamPos,camUpdate.eye);
    gl.uniform1f(locW.uFogDen,fogDen); gl.uniform1f(locW.uSpec,P.spec*(night?.6:1));
    const dusk=S&&S.phase==='dusk';
    gl.uniform3fv(locW.uShal, night?[.08,.16,.26]:dusk?[.4,.6,.6]:[.36,.78,.7]);
    gl.uniform3fv(locW.uDeep, night?[.03,.06,.13]:dusk?[.12,.3,.46]:[.07,.33,.55]);
    gl.uniform3fv(locW.uSkyHi, fogCol);
    gl.bindBuffer(gl.ARRAY_BUFFER,bufWaterPos);
    gl.enableVertexAttribArray(locW.aPos);
    gl.vertexAttribPointer(locW.aPos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bufWaterIdx);
    gl.drawElements(gl.TRIANGLES,waterIdx.length,gl.UNSIGNED_SHORT,0);
    // lit meshes
    gl.useProgram(progLit);
    gl.uniformMatrix4fv(locL.uProj,false,projM); gl.uniformMatrix4fv(locL.uView,false,viewM);
    gl.uniform3fv(locL.uLDir,ld);
    gl.uniform3fv(locL.uSun,sun.map(c=>c*(night?.55:.78)));
    gl.uniform3fv(locL.uAmb,[amb,amb,amb]);
    gl.uniform3fv(locL.uFirePos,firePos); gl.uniform3fv(locL.uFireCol,fireCol);
    gl.uniform1f(locL.uFireOn,fireOn?1:0);
    gl.uniform3fv(locL.uFogCol,fogCol); gl.uniform3fv(locL.uCamPos,camUpdate.eye);
    gl.uniform1f(locL.uFogDen,fogDen);
    const drawBuf=(buf,n)=>{ if(!n)return;
      gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.enableVertexAttribArray(locL.aPos); gl.vertexAttribPointer(locL.aPos,3,gl.FLOAT,false,40,0);
      gl.enableVertexAttribArray(locL.aNorm); gl.vertexAttribPointer(locL.aNorm,3,gl.FLOAT,false,40,12);
      gl.enableVertexAttribArray(locL.aCol); gl.vertexAttribPointer(locL.aCol,3,gl.FLOAT,false,40,24);
      gl.enableVertexAttribArray(locL.aEmis); gl.vertexAttribPointer(locL.aEmis,1,gl.FLOAT,false,40,36);
      gl.drawArrays(gl.TRIANGLES,0,n); };
    drawBuf(bufStatic,nStatic); drawBuf(bufIsland,nIsland); drawBuf(bufDyn,nDyn);
  }
  drawOverlay(t);
  requestAnimationFrame(frame); }

resize();
glInit();
requestAnimationFrame(frame);
</script>

<script>
// ---------------- UI ----------------
const $=id=>document.getElementById(id);
function fmt(iso){ const d=new Date(iso);
  return d.toLocaleDateString(undefined,{weekday:'short'})+' '+
         d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderUI(){
  if(!S)return;
  $('chap').textContent=`Day ${S.island_day} · Cycle ${S.cycle} · ${S.chapter}`;
  $('meta').innerHTML=`${S.phase} · ${S.weather} · tide ${S.tide}<br>${S.moon.name}`;
  const latest=(S.recent||[]).slice(-1)[0];
  $('ticker').textContent = latest? latest.text : 'A tiny island. One guy. Somewhere, a story is starting.';
  $('loglist').innerHTML=(S.recent||[]).slice().reverse().map(e=>
    `<div class="ev ${e.kind}"><time>${fmt(e.iso)}</time>${esc(e.text)}</div>`).join('');
  const n=S.needs;
  $('stats').innerHTML=`<div class="needs">`+
    ['hunger','energy','mood','boredom','loneliness'].map(k=>
      `${k} <span class="bar"><i style="width:${n[k]}%"></i></span>${n[k]}`).join('<br>')+
    `<br><br>doing: ${esc(S.activity_label)}<br>raft ${S.world.raft_progress}% · wood ${S.world.wood} · coconuts ${S.world.coconuts}`+
    (S.state_line?`<br><br><span style="opacity:.6">${esc(S.state_line)}</span>`:'')+`</div>`;
  $('miles').innerHTML=(S.milestones||[]).map(m=>
    `<div class="ev milestone">★ ${esc(m.label)}<time>day ${m.day}, cycle ${m.cycle}</time></div>`).join('')||
    '<div class="ev">No firsts yet. Wade is just getting started.</div>';
  if(S.catchup && S.catchup.length>0){
    $('cuhead').textContent=`WHILE YOU WERE AWAY (${S.catchup.length})`;
    $('culist').innerHTML=S.catchup.map(e=>
      `<div class="ev ${e.kind}"><time>${fmt(e.iso)}</time>${esc(e.text)}</div>`).join('');
    $('catchup').classList.add('open');
  }
}

async function poll(){
  try{
    const q=lastVisit?`?since=${encodeURIComponent(lastVisit)}`:'';
    const r=await fetch('/api/state'+q);
    S=await r.json();
    try{ localStorage.setItem('shipwrecked_last', new Date().toISOString()); }catch(e){}
    lastVisit=null; // catch-up only on first load of a visit
    renderUI();
  }catch(e){ /* island weathered the disconnect; try again next tick */ }
}
poll(); setInterval(poll, 30000);

$('logbtn').onclick=()=>$('drawer').classList.toggle('open');
$('closebtn').onclick=()=>$('drawer').classList.remove('open');
$('cubtn').onclick=()=>$('catchup').classList.remove('open');
</script>
</body>

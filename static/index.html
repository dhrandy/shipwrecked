function glowSprite(size,inner,outer){ const c=document.createElement('canvas'); c.width=c.height=128;

const moonSpr=glowSprite(300,'rgba(232,236,244,1)','rgba(150,170,210,.4)'); scene3.add(moonSpr);
{ const n=2600, pos=new Float32Array(n*3), r=rnd(9);
  for(let i=0;i<n;i++){ const th=r()*Math.PI*2, ph=Math.acos(r()*.95);

// ---------------- island terrain ----------------
const ISL_R=195;
function islR(th){ return ISL_R*(1+.13*Math.sin(3*th+1.1)+.07*Math.sin(7*th+.4)); }
function islH(f){ return 46*Math.pow(Math.max(0,1-f*f),.75); }

// (v0.5.x placed feet on the analytic height only - that is what made legs float/sink.)
function meshGroundY(x,z){ const d=Math.hypot(x,z), th=Math.atan2(z,x);

  y+=(vnoise(x*.045,z*.045)-.5)*7*f + (vnoise(x*.16,z*.16)-.5)*2.2*f;
  y+=(vnoise(x*.3,z*.3)-.5)*.55*(1-f);

function buildIsland(){ const K=30, J=110, pos=[], col=[], idx=[];

  for(let k=0;k<=K;k++){ const f=k/K;
    for(let j=0;j<=J;j++){ const th=j/J*Math.PI*2, R=islR(th)*f;

      let y=2+islH(f);

      y+= (vnoise(x*.3,z*.3)-.5)*.55*(1-f);

      if(f>.9){ const w=clamp((f-.9)/.06,0,1);
        c=[c[0]+(wet[0]-c[0])*w, c[1]+(wet[1]-c[1])*w, c[2]+(wet[2]-c[2])*w]; }
      const gA2=[ grassA[0]+(grassB[0]-grassA[0])*n, grassA[1]+(grassB[1]-grassA[1])*n, grassA[2]+(grassB[2]-grassA[2])*n ];
      const hp=vnoise(x*.06+9,z*.06+9);

      c=[ c[0]+(gc[0]-c[0])*g, c[1]+(gc[1]-c[1])*g, c[2]+(gc[2]-c[2])*g ];
      col.push(c[0],c[1],c[2]); } }
  for(let k=0;k<K;k++) for(let j=0;j<J;j++){ const a=k*(J+1)+j, b=a+1, c2=a+J+1, d=c2+1;
    idx.push(a,c2,b, b,c2,d); }

    pos.push(Math.cos(th)*R,-14,Math.sin(th)*R); col.push(.62,.5,.36); }

const WN=150, WSPAN=7000;
function wmap(s){ const half=WSPAN/2; return Math.sign(s)*half*Math.pow(Math.abs(s),2.55); }
const waterU={ uTime:{value:0}, uTide:{value:0},
  uShal:{value:new THREE.Color('#3ec2b4')}, uDeep:{value:new THREE.Color('#0d3a5e')},
  uSky:{value:new THREE.Color('#bfe0ee')}, uSunDir:{value:new THREE.Vector3(.45,.62,.45)},
  uSunCol:{value:new THREE.Color('#fff3d8')}, uFogCol:{value:new THREE.Color('#bfe0ee')},
  uCamPos:{value:new THREE.Vector3()}, uFogDen:{value:.00062}, uSpec:{value:.9} };
let waterMesh;

  const g=new THREE.BufferGeometry();

  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));

    vertexShader:`uniform float uTime,uTide; varying vec3 vW; varying float vBrk;
      float islR(float th){ return 195.*(1.+.13*sin(3.*th+1.1)+.07*sin(7.*th+.4)); }
      float wave(vec2 p, vec2 d, float f, float sp, float amp){ return sin(dot(p,d)*f+uTime*sp)*amp; }
      void main(){ vec3 p=position;
        float d0=length(p.xz);
        float shoreR=islR(atan(p.z,p.x));
        float amp = (1.2 + 2.6*smoothstep(shoreR+80., shoreR+700., d0)) * (1.-smoothstep(900.,2600.,d0)*.8);   // calm lagoon, rolling sea, far sea settles (no terraced horizon)
        float leeV=.35+.65*smoothstep(-.35,.8,cos(atan(p.z,p.x)-.585));   // swell arrives from dir (.83,.55)
        amp += 3.1*exp(-pow((d0-shoreR-70.)/60.,2.))*leeV;                // breaker train rears outside the beach, swell side
        float h = wave(p.xz,vec2(.83,.55),.021,.00115,1.) + wave(p.xz,vec2(-.42,.91),.033,.0009,.7)

        float d=length(vW.xz); float th=atan(vW.z,vW.x); float shore=islR(th);

        float e=6.;
        float hC = sin(dot(vW.xz,vec2(.83,.55))*.021+uTime*.00115) + sin(dot(vW.xz,vec2(-.42,.91))*.033+uTime*.0009);
        float hX = sin(dot(vW.xz+vec2(e,0.),vec2(.83,.55))*.021+uTime*.00115) + sin(dot(vW.xz+vec2(e,0.),vec2(-.42,.91))*.033+uTime*.0009);
        float hZ = sin(dot(vW.xz+vec2(0.,e),vec2(.83,.55))*.021+uTime*.00115) + sin(dot(vW.xz+vec2(0.,e),vec2(-.42,.91))*.033+uTime*.0009);

function buildGrassTufts(){ const r=rnd(313);
  const geo=new THREE.ConeGeometry(.55,3.4,4);
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9});
  const N=420, inst=new THREE.InstancedMesh(geo,mat,N);
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), v=new THREE.Vector3(), sc=new THREE.Vector3();
  const cA=new THREE.Color(.28,.55,.16), cB=new THREE.Color(.50,.72,.24), cc=new THREE.Color();
  for(let i=0;i<N;i++){ const th=r()*6.283, f=.08+r()*.48, R=islR(th)*f;
    const x=Math.cos(th)*R, z=Math.sin(th)*R, y=meshGroundY(x,z);
    e.set((r()-.5)*.5,r()*6.28,(r()-.5)*.5); q.setFromEuler(e);
    const s=.4+r()*.5; sc.set(s,s*(0.6+r()*.5),s);
    v.set(x,y+1.4*sc.y,z);
    m4.compose(v,q,sc); inst.setMatrixAt(i,m4);
    cc.copy(cA).lerp(cB,r()); inst.setColorAt(i,cc); }
  inst.castShadow=false; scene3.add(inst); }

    const ladle=new THREE.Group();
    const ls=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.3,6),std(0x8a6a42,.85)); ls.position.y=.15; ladle.add(ls);
    const lc=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6,0,Math.PI*2,0,Math.PI/2),std(0x9a9a9a,.5,{metalness:.4})); lc.position.y=.3; ladle.add(lc);
    ladle.visible=false; slotR.add(ladle); gear.ladle=ladle; }
  if(slotL){ const heldLog=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.5,8),std(0x8a6a42,.85));
    heldLog.rotation.z=Math.PI/2; heldLog.visible=false; slotL.add(heldLog); gear.heldLog=heldLog; }
  return {g, mixer, play, acts, headObj:head||g, gear}; }
// standing idle used to loop the same 'Idle' clip forever (Randy: "same repetitive motion").
// now: rotate base idles, drop in one-shot fidgets at random intervals.
const idleSm={clip:'Idle',until:0,fidget:false};
const IDLE_BASES=['Idle','Unarmed_Idle'];
const IDLE_FIDGETS=['Spellcast_Raise','PickUp','Throw','Interact','1H_Ranged_Aiming'];
function idleClip(t){
  if(t<idleSm.until) return idleSm.clip;
  if(!idleSm.fidget && Math.random()<.5){
    idleSm.fidget=true;
    idleSm.clip=IDLE_FIDGETS[Math.floor(Math.random()*IDLE_FIDGETS.length)];
    const dur=(wadeMesh&&wadeMesh.acts[idleSm.clip])?wadeMesh.acts[idleSm.clip].getClip().duration:1.6;
    idleSm.until=t+dur*1000+Math.random()*700;
  } else {
    idleSm.fidget=false;
    idleSm.clip=IDLE_BASES[Math.floor(Math.random()*IDLE_BASES.length)];
    idleSm.until=t+5000+Math.random()*7000;
  }
  return idleSm.clip; }
// which animation clip each activity uses
function wadeClip(act,walking,atChest){
  if(walking) return act==='jog'?'Running_A':'Walking_A';
  if(atChest) return 'PickUp';
  switch(act){
    case 'fish': return 'Sit_Floor_Idle';
    case 'cook': case 'tend_fire': return 'Use_Item';
    case 'write_bottle': return 'Use_Item';
    case 'sandcastle': case 'raft_work': return 'Interact';
    case 'gather_wood': return 'PickUp';
    case 'coconut': return 'Spellcast_Raise';
    case 'signal': return 'Cheer';
    case 'nap': case 'sleep': case 'stargaze': return 'Lie_Idle';
    default: return 'Idle'; } }

// walking locomotion: he really crosses the island between activities
const SPOTS={
  fish:[150,95], gather_wood:[92,-16], raft_work:[108,70], nap:[-54,30],
  sleep:[-30,46], jog:null, coconut:[-56,30], sandcastle:[70,120],
  signal:[-20,-160], cook:[-13,13], write_bottle:[26,150], stargaze:[4,26],
  bathe:[210,80], tend_fire:[-13,13], stand:[10,110] };
const NEAR={
  fish:{x:240,z:150}, gather_wood:{x:95,z:-24}, raft_work:RAFT, coconut:PALM,
  cook:FIRE, tend_fire:FIRE, sandcastle:{x:78,z:128}, signal:{x:-30,z:-450},
  nap:PALM, write_bottle:{x:0,z:340} };
let t0=0;
const walker={x:10,z:110,yaw:0,tx:10,tz:110,walking:false,speed:1.7,waypoint:null,hasGear:false,act:'stand',pickT:0};
function walkerTarget(){ const act=S?S.activity:'stand';
  if(act==='jog'){ const a=Math.sin(t0*.00006)*.9+.2; return {x:70+55*Math.cos(a),z:30+65*Math.sin(a)}; }
  const p=SPOTS[act]||SPOTS.stand; return {x:p[0],z:p[1]}; }
function walkerStep(dt){
  const act=S?S.activity:'stand';
  if(act!==walker.act){
    walker.act=act;
    if(GEAR_ACTS.includes(act)){ walker.waypoint={x:CHEST.x+10,z:CHEST.z+4}; walker.hasGear=false; walker.pickT=0; }
    else walker.waypoint=null; }
  let tgt=walkerTarget();
  if(walker.waypoint) tgt=walker.waypoint;
  walker.tx=tgt.x; walker.tz=tgt.z;
  const dx=walker.tx-walker.x, dz=walker.tz-walker.z, d=Math.hypot(dx,dz);
  if(walker.waypoint&&d<5){
    walker.pickT+=dt;
    if(walker.pickT>1100){ walker.waypoint=null; walker.hasGear=true; } }
  walker.walking=d>4;
  if(walker.walking){
    const want=Math.atan2(dx,dz);
    let dy=want-walker.yaw; while(dy>Math.PI)dy-=6.283; while(dy<-Math.PI)dy+=6.283;
    walker.yaw+=dy*Math.min(1,dt*.006);
    const sp=walker.speed*(S&&S.activity==='jog'?2.2:1)*Math.min(1,Math.max(.3,d/18));
    walker.x+=Math.sin(walker.yaw)*sp; walker.z+=Math.cos(walker.yaw)*sp; }
  return d; }

// ---------------- phase application ----------------
const WATER_COLS={
  dawn:{shal:'#3aa8a4',deep:'#1a3a5e'}, day:{shal:'#3ec2b4',deep:'#11496f'},
  dusk:{shal:'#2e8f8c',deep:'#14355c'}, night:{shal:'#12303e',deep:'#061526'} };
function applyPhase(){ const P=pal(), ph=S?S.phase:'dusk';
  skyU.topColor.value.set(P.sky[0]); skyU.midColor.value.set(P.sky[1]); skyU.botColor.value.set(P.sky[3]);
  scene3.fog.color.set(P.fog); waterU.uFogCol.value.set(P.fog);
  const lv=new THREE.Vector3(...P.lv).normalize();
  sun.position.copy(lv).multiplyScalar(900); sun.target.position.set(0,0,0);
  sun.color.set(P.sun); sun.intensity=P.sunI;
  sun.castShadow=ph!=='night';
  hemi.color.set(P.hemi); hemi.groundColor.set(0x8a7355); hemi.intensity=P.amb;
  waterU.uSunDir.value.copy(lv); waterU.uSunCol.value.set(P.sun);
  waterU.uSky.value.set(P.sky[1]);  // melt into blue air, not the warm horizon band (cream there turned the far sea tan) waterU.uSpec.value=P.spec;
  const wc=WATER_COLS[ph]||WATER_COLS.day;
  waterU.uShal.value.set(wc.shal); waterU.uDeep.value.set(wc.deep);
  window.__stars.material.opacity=ph==='night'?.85:ph==='dusk'?.18:0;
  sunSpr.visible=ph!=='night'; moonSpr.visible=ph==='night';
  sunSpr.position.copy(lv).multiplyScalar(3300); moonSpr.position.set(-1350,1500,-1450);
  const cl=S&&S.weather==='cloudy'?.4:1;
  for(const c of cloudSprites){ c.m.material.opacity=(ph==='night'?.16:ph==='dusk'?.55:.85)*cl;
    c.m.material.color.set(ph==='dusk'?0xffd0a0:ph==='night'?0x8899bb:0xfff2df); }
  if(window.__isleMat) window.__isleMat.color.set(ph==='night'?0x141f33:ph==='dusk'?0x5c4458:ph==='dawn'?0x6a5a72:0x6f94ad);
  const lit=!!(S&&S.world.fire_lit);
  if(fireLight) fireLight.intensity=lit? 1.6+Math.sin(t0*.03)*.4+Math.sin(t0*.017)*.2 : 0;
  if(fireFlame) fireFlame.visible=lit;
  if(fireInner) fireInner.visible=lit;
  if(chestGlow){ const open=S&&GEAR_ACTS.includes(S.activity)&&walker.waypoint&&Math.hypot(walker.x-CHEST.x,walker.z-CHEST.z)<22;
    chestGlow.intensity=open?1.4:0; } }

// ---------------- camera ----------------
let camAng=.6, camDrift=0;
function camUpdate(){ camDrift+=.00016;
  if(new URLSearchParams(location.search).has('wadecam')){
    const wx=walker.x, wz=walker.z, gy=meshGroundY(wx,wz), f=wadeMesh.g.rotation.y;
    camera.position.set(wx+Math.sin(f)*90, gy+34, wz+Math.cos(f)*90);
    camera.lookAt(wx,gy+16,wz); return; }
  const base=Math.atan2(walker.x,300);
  const want=base+Math.sin(camDrift)*.95;
  camAng+=(want-camAng)*.02;
  const phone=W<700, R=phone?760:640;
  camera.position.set(Math.sin(camAng)*R,(phone?210:165)+Math.sin(camDrift*.7)*8,Math.cos(camAng)*R);
  camera.lookAt(0,58,0); }

// ---------------- 2D overlay: thought bubble, Zs, rain ----------------
function project(x,y,z){ const v=new THREE.Vector3(x,y,z).project(camera);
  if(v.z>1) return null; return {x:(v.x+1)/2*W, y:(1-v.y)/2*H}; }
function drawOverlay(t){ fxctx.clearRect(0,0,W,H);
  if(!S) return;
  const head=wadeMesh.headObj.getWorldPosition(new THREE.Vector3());
  if(S.weather==='rain'||S.weather==='storm'){
    fxctx.strokeStyle='rgba(180,200,220,.4)'; fxctx.lineWidth=1;
    const n=W<700?60:120;
    for(let i=0;i<n;i++){ const x=((i*97)+t*.7)%W, y=((i*61)+t*1.9)%H;
      fxctx.beginPath(); fxctx.moveTo(x,y); fxctx.lineTo(x-3,y+11); fxctx.stroke(); }
    if(S.weather==='storm'&&Math.floor(t/4200)!==Math.floor((t-16)/4200)&&Math.random()<.3){
      fxctx.fillStyle='rgba(220,230,255,.28)'; fxctx.fillRect(0,0,W,H); } }
  if((S.activity==='sleep'||S.activity==='nap')){
    const hp=project(head.x,head.y+10,head.z);
    if(hp){ fxctx.fillStyle='#fff'; fxctx.textAlign='center'; fxctx.textBaseline='middle';
      for(let i=0;i<3;i++){ const zp=((t*.0004)+i/3)%1;
        fxctx.globalAlpha=zp<.15?zp/.15*.9:Math.max(0,(1-zp))*1.1;
        fxctx.font='bold '+(10+i*5)+'px monospace';
        fxctx.fillText('z', hp.x+12+i*9+zp*9, hp.y-4-zp*40-i*5); }
      fxctx.globalAlpha=1; } }
  if(S.thought){
    const hp=project(head.x,head.y+6,head.z);
    if(hp){ fxctx.font='15px serif'; const tw=fxctx.measureText(S.thought).width;
      const bw2=Math.min(tw+26,W*.8), bh=34;
      const bx=Math.min(Math.max(hp.x+10,bw2/2+8),W-bw2/2-8), by=Math.max(hp.y-64,bh/2+8);
      fxctx.fillStyle='rgba(255,255,255,.92)';
      fxctx.beginPath(); fxctx.roundRect(bx-bw2/2,by-bh/2,bw2,bh,16); fxctx.fill();
      fxctx.beginPath(); fxctx.arc(bx-bw2/2+12,by+bh/2+8,6,0,7); fxctx.fill();
      fxctx.beginPath(); fxctx.arc(hp.x+4,hp.y-6,3.5,0,7); fxctx.fill();
      fxctx.fillStyle='#333'; fxctx.textAlign='center'; fxctx.textBaseline='middle';
      fxctx.fillText(S.thought,bx,by+1); } } }

// ---------------- build + frame ----------------
let wadeMesh=null, lastT=0;
function frame(t){ t0=t;
  if(window.S) S=window.S;   // UI script (classic) owns the poll; module reads its state
  const dt=Math.min(80,t-lastT); lastT=t;
  waterU.uTime.value=t;
  waterU.uTide.value=S?(S.tide==='high'?2.5:S.tide==='low'?-2:0):0;
  if(S&&S.world.raft_progress!==raftProg){ raftProg=S.world.raft_progress; buildRaft(); }
  walkerStep(dt);
  const gy=meshGroundY(walker.x,walker.z);
  const act=S?S.activity:'stand';
  wadeMesh.g.position.set(walker.x, gy, walker.z);
  const near=NEAR[act];
  const face=walker.walking? walker.yaw : (near? Math.atan2(near.x-walker.x,near.z-walker.z) : walker.yaw);
  wadeMesh.g.rotation.y=face;
  const atChest=walker.waypoint&&!walker.walking;
  let clip=wadeClip(act,walker.walking,atChest);
  if(clip==='Idle') clip=idleClip(t);
  wadeMesh.play(clip);
  wadeMesh.mixer.update(dt/1000);
  const gr=wadeMesh.gear;
  if(gr.rod) gr.rod.visible=act==='fish'&&walker.hasGear;
  if(gr.heldLog) gr.heldLog.visible=act==='gather_wood'&&walker.hasGear;
  if(gr.heldBot) gr.heldBot.visible=act==='write_bottle'&&walker.hasGear;
  if(gr.torch) gr.torch.visible=act==='signal'&&walker.hasGear;
  if(gr.ladle) gr.ladle.visible=(act==='cook'||act==='tend_fire')&&walker.hasGear;
  // palms breathe in the trade wind
  for(const p of palmSway) p.m.rotation.z=p.baseZ+Math.sin(t*.0009+p.ph)*.02;
  // crab scuttles sideways along the tide line
  if(window.__crab){ const cb=window.__crab;
    const cx=cb.x0+Math.sin(t*.0004)*10, cz=cb.z;
    cb.m.position.set(cx, meshGroundY(cx,cz)+.3, cz); }
  // gull circles the lagoon
  const ga=t*.00035;
  gullFly.position.set(Math.cos(ga)*300, 90+Math.sin(t*.0009)*22, Math.sin(ga)*300);
  gullFly.rotation.y=-ga+Math.PI/2;
  const flap=Math.sin(t*.012)*.7;
  gullFly.userData.wings[0].rotation.x=.25+flap; gullFly.userData.wings[1].rotation.x=-.25-flap;
  // shark patrols the shallows, fin cutting the surface
  if(shark){ const sa=t*.00018;
    const sd=islR(sa*6.28+1.3)+95;
    const sx=Math.cos(sa*6.28)*sd, sz2=Math.sin(sa*6.28)*sd;
    shark.position.set(sx, (S?(S.tide==='high'?2.5:S.tide==='low'?-2:0):0)-3.2, sz2);
    shark.rotation.y=-sa*6.28+Math.PI;
    if(sharkMixer) sharkMixer.update(dt/1000); }
  // finished raft bobs at its mooring
  if(raftDone) raftDone.position.y=1.2+Math.sin(t*.0011)*.8;
  // clouds drift
  for(const c of cloudSprites){ c.m.position.x+=c.sp*.05; if(c.m.position.x>2600) c.m.position.x=-2600; }
  camUpdate();
  waterU.uCamPos.value.copy(camera.position);
  applyPhase();
  renderer.render(scene3,camera);
  drawOverlay(t);
  requestAnimationFrame(frame); }
async function init(){
  await loadAssets();
  buildIsland(); buildWater(); buildRocks(); buildPalms(); buildGrassTufts(); buildChest(); buildFirePit();
  buildRaft(); buildCampDecor(); buildShark(); buildBirds(); buildClouds(); buildHorizonIsles();
  wadeMesh=buildWade();
  resize();
  requestAnimationFrame(frame); }
init();

</script>
</script>
<script>
// ---------------- UI ----------------
const $=id=>document.getElementById(id);
let lastVisit=null;
try { lastVisit=localStorage.getItem('shipwrecked_last'); } catch(e){}
function fmt(iso){ const d=new Date(iso);
  return d.toLocaleDateString(undefined,{weekday:'short'})+' '+
         d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderUI(){
  if(!S)return;
  $('chap').textContent=`Day ${S.island_day} · Cycle ${S.cycle} · ${S.chapter}`;
  $('meta').innerHTML=`${S.phase} · ${S.weather} · tide ${S.tide}<br>${S.moon.name}`;
  const latest=(S.recent||[]).slice(-1)[0];
  $('ticker').textContent = latest? latest.text : 'A tiny island. One guy. Somewhere, a story is starting.';
  $('loglist').innerHTML=(S.recent||[]).slice().reverse().map(e=>
    `<div class="ev ${e.kind}"><time>${fmt(e.iso)}</time>${esc(e.text)}</div>`).join('');
  const n=S.needs;
  $('stats').innerHTML=`<div class="needs">`+
    ['hunger','energy','mood','boredom','loneliness'].map(k=>
      `${k} <span class="bar"><i style="width:${n[k]}%"></i></span>${n[k]}`).join('<br>')+
    `<br><br>doing: ${esc(S.activity_label)}<br>raft ${S.world.raft_progress}% · wood ${S.world.wood} · coconuts ${S.world.coconuts}`+
    (S.state_line?`<br><br><span style="opacity:.6">${esc(S.state_line)}</span>`:'')+`</div>`;
  $('miles').innerHTML=(S.milestones||[]).map(m=>
    `<div class="ev milestone">★ ${esc(m.label)}<time>day ${m.day}, cycle ${m.cycle}</time></div>`).join('')||
    '<div class="ev">No firsts yet. Wade is just getting started.</div>';
  if(S.catchup && S.catchup.length>0){
    $('cuhead').textContent=`WHILE YOU WERE AWAY (${S.catchup.length})`;
    $('culist').innerHTML=S.catchup.map(e=>
      `<div class="ev ${e.kind}"><time>${fmt(e.iso)}</time>${esc(e.text)}</div>`).join('');
    $('catchup').classList.add('open');
  }
}

async function poll(){
  try{
    const q=lastVisit?`?since=${encodeURIComponent(lastVisit)}`:'';
    const r=await fetch('/api/state'+q);
    S=await r.json();
    try{ localStorage.setItem('shipwrecked_last', new Date().toISOString()); }catch(e){}
    lastVisit=null; // catch-up only on first load of a visit
    renderUI();
  }catch(e){ /* island weathered the disconnect; try again next tick */ }
}
poll(); setInterval(poll, 30000);

$('logbtn').onclick=()=>$('drawer').classList.toggle('open');
$('closebtn').onclick=()=>$('drawer').classList.remove('open');
$('cubtn').onclick=()=>$('catchup').classList.remove('open');
</script>
